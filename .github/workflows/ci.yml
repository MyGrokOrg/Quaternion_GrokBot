name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler:
          - { name: gcc-14, cxx: g++-14, flags: "" }
          - { name: clang-18-libstdcxx, cxx: clang++-18, flags: "" }
          - { name: clang-18-libcxx, cxx: clang++-18, flags: "-stdlib=libc++" }
          - { name: clang-19-libstdcxx, cxx: clang++-19, flags: "", llvm: 19 }
          - { name: clang-19-libcxx, cxx: clang++-19, flags: "-stdlib=libc++", llvm: 19 }
    name: ${{ matrix.compiler.name }} (${{ matrix.build_type }})
    steps:
      - uses: actions/checkout@v5
      - name: Install clang from apt.llvm.org
        if: matrix.compiler.llvm
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.compiler.llvm }}
      - name: Install libc++
        if: contains(matrix.compiler.flags, 'libc++')
        run: |
          v=${{ matrix.compiler.llvm || 18 }}
          sudo apt-get update && sudo apt-get install -y libc++-$v-dev libc++abi-$v-dev
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} "-DCMAKE_CXX_FLAGS=${{ matrix.compiler.flags }}"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix ${{ runner.temp }}/install

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  benchmarks:
    # Informational only: never fails the workflow; results are uploaded as an artifact.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DQUATERNION_BUILD_BENCHMARKS=ON -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build -j --target quaternion_bench
      - name: Run
        run: ./build/quaternion_bench --min-time 0.1 --json bench.json | tee bench.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench.json
            bench.txt
