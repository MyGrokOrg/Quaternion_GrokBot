name: CI

on:
  push:
    branches: [main, fp-contract-restore]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler:
          - { name: gcc-14, cxx: g++-14, flags: "" }
          - { name: clang-18-libstdcxx, cxx: clang++-18, flags: "" }
          - { name: clang-18-libcxx, cxx: clang++-18, flags: "-stdlib=libc++" }
          - { name: clang-19-libstdcxx, cxx: clang++-19, flags: "", llvm: 19 }
          - { name: clang-19-libcxx, cxx: clang++-19, flags: "-stdlib=libc++", llvm: 19 }
    name: ${{ matrix.compiler.name }} (${{ matrix.build_type }})
    steps:
      - uses: actions/checkout@v5
      - name: Install clang from apt.llvm.org
        if: matrix.compiler.llvm
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.compiler.llvm }}
      - name: Install libc++
        if: contains(matrix.compiler.flags, 'libc++')
        run: |
          v=${{ matrix.compiler.llvm || 18 }}
          sudo apt-get update && sudo apt-get install -y libc++-$v-dev libc++abi-$v-dev
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} "-DCMAKE_CXX_FLAGS=${{ matrix.compiler.flags }}"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix ${{ runner.temp }}/install

  windows:
    # MSVC (latest toolset) and clang-cl with the MSVC STL, through the default (newest)
    # Visual Studio generator; /std:c++latest via CMAKE_CXX_STANDARD 23.  long double is
    # double on this platform.  x64 on windows-latest, plain and /arch:AVX2 (with FMA
    # contraction: /fp:contract for MSVC, clang-cl's default); ARM64 on windows-11-arm.
    runs-on: ${{ matrix.runner || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: msvc, toolset: "", build_type: Debug }
          - { name: msvc, toolset: "", build_type: Release }
          - { name: clang-cl, toolset: "-T ClangCL", build_type: Release }
          - { name: msvc /arch:AVX2, toolset: "", build_type: Release, cxxflags: "/arch:AVX2", avx2: true }
          - { name: msvc /arch:AVX2 /fp:contract, toolset: "", build_type: Release, cxxflags: "/arch:AVX2 /fp:contract", avx2: true }
          - { name: clang-cl /arch:AVX2, toolset: "-T ClangCL", build_type: Release, cxxflags: "/arch:AVX2", avx2: true }
          - { name: msvc ARM64, toolset: "", build_type: Debug, arch: ARM64, runner: windows-11-arm }
          - { name: msvc ARM64, toolset: "", build_type: Release, arch: ARM64, runner: windows-11-arm }
          - { name: msvc ARM64 /fp:contract, toolset: "", build_type: Release, cxxflags: "/fp:contract", arch: ARM64, runner: windows-11-arm }
          - { name: clang-cl ARM64, toolset: "-T ClangCL", build_type: Release, arch: ARM64, runner: windows-11-arm }
    name: ${{ matrix.name }} (${{ matrix.build_type }})
    env:
      CXXFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@v5
      - name: CPU
        run: |
          (Get-CimInstance Win32_Processor).Name
          $env:PROCESSOR_ARCHITECTURE
      - name: Check the CPU has AVX2 and FMA
        if: matrix.avx2
        run: |
          Add-Type -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool IsProcessorFeaturePresent(uint f);' -Name K -Namespace W
          # PF_AVX2_INSTRUCTIONS_AVAILABLE = 40; FMA3 ships with AVX2 on every x64 CPU that has it
          if (-not [W.K]::IsProcessorFeaturePresent(40)) { throw "no AVX2" }
      - name: Configure
        run: |
          cmake -B build -A ${{ matrix.arch || 'x64' }} ${{ matrix.toolset }}
          Select-String -Path build/test_core.vcxproj -Pattern '<LanguageStandard>|<EnableEnhancedInstructionSet>|<FloatingPointModel>|<AdditionalOptions>' | Select-Object -First 4
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j
      - name: Test
        run: |
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # informational: how often the C library's hypot differs from a correctly rounded one
          & build/${{ matrix.build_type }}/test_constexpr.exe | Select-String 'hypot|differs'
          & build/${{ matrix.build_type }}/test_bitident.exe | Select-String 'FMA build'
          # the includer's contraction state before and after the headers
          & build/${{ matrix.build_type }}/test_fpcontract.exe
      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }} --prefix ${{ runner.temp }}/install

  bitident-windows:
    # The bit-identity checks of the Linux haswell job, on Windows: tests/bitident/windows.py
    # builds tests/bitident/dump.cpp with MSVC and clang-cl, plain, /arch:AVX2 and with FMA
    # contraction, against this header and the pre-constexpr one, and compares the bits
    # (old vs new, vs the Linux golden hashes, and across the builds).
    name: bit-identity (windows ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, llvm: x64 }
          - { arch: arm64, runner: windows-11-arm, llvm: ARM64 }
    env:
      BASELINE: 91cad1a
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Baseline headers
        shell: bash
        run: |
          mkdir -p old/quaternion
          git show $BASELINE:include/quaternion.hpp > old/quaternion.hpp
          git show $BASELINE:include/quaternion/quaternion.hpp > old/quaternion/quaternion.hpp
          git show $BASELINE:include/quaternion/special_functions.hpp > old/quaternion/special_functions.hpp
      - name: Compare
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=${{ matrix.arch }} -host_arch=${{ matrix.arch }}'
          cl 2>&1 | Select-Object -First 1
          $clangcl = "$vs\VC\Tools\Llvm\${{ matrix.llvm }}\bin\clang-cl.exe"
          if (Test-Path $clangcl) { & $clangcl --version | Select-Object -First 1 }
          python tests/bitident/windows.py --arch ${{ matrix.arch }} --clang-cl "$clangcl" --report bitident.md
          $code = $LASTEXITCODE
          Get-Content bitident.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  bitident-haswell:
    # Runtime results of the transcendental-free operations must not change with the
    # constexpr work: compile tests/bitident/dump.cpp against the header at the baseline
    # commit and against this one (same compiler, same flags, with FMA contraction) and
    # compare the raw result bits; then run the test suites in the haswell build.
    name: bit-identity (haswell)
    runs-on: ubuntu-24.04
    env:
      BASELINE: 91cad1a
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the CPU has FMA/AVX2
        run: grep -qw fma /proc/cpuinfo && grep -qw avx2 /proc/cpuinfo
      - name: Baseline headers
        run: |
          mkdir -p old/quaternion
          git show $BASELINE:include/quaternion.hpp > old/quaternion.hpp
          git show $BASELINE:include/quaternion/quaternion.hpp > old/quaternion/quaternion.hpp
          git show $BASELINE:include/quaternion/special_functions.hpp > old/quaternion/special_functions.hpp
      - name: Old vs new raw bits
        run: |
          set -e
          for cxx in g++-14 clang++-18; do
            for opt in -O2 -O3; do
              $cxx -std=c++23 $opt -march=haswell -Iold/quaternion tests/bitident/dump.cpp -o dump_old
              $cxx -std=c++23 $opt -march=haswell -Iinclude/quaternion tests/bitident/dump.cpp -o dump_new
              ./dump_old > old.txt; ./dump_new > new.txt
              echo "$cxx $opt: $(wc -l < new.txt) hashes"
              diff old.txt new.txt
            done
          done
      - name: Test suites (-march=haswell)
        run: |
          set -e
          cmake -B build-clang -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-march=haswell
          cmake --build build-clang -j
          ctest --test-dir build-clang --output-on-failure
          cmake -B build-gcc -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-march=haswell
          cmake --build build-gcc -j
          ctest --test-dir build-gcc --output-on-failure

  benchmarks:
    # Informational only: never fails the workflow; results are uploaded as an artifact.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DQUATERNION_BUILD_BENCHMARKS=ON -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build -j --target quaternion_bench
      - name: Run
        run: ./build/quaternion_bench --min-time 0.1 --json bench.json | tee bench.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench.json
            bench.txt
