name: macdiag (temporary)
on:
  push:
    branches: [macos-support]
jobs:
  diag:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - run: |
          clang++ --version | head -1
          clang++ -std=c++23 -O2 -Iinclude diag/mac.cpp -o dm && ./dm
          clang++ -std=c++23 -O2 -ffp-contract=off -Iinclude diag/mac.cpp -o dm2 && ./dm2 | grep eps || true
