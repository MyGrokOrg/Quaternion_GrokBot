name: macdiag (temporary)
on:
  push:
    branches: [macos-support]
jobs:
  diag:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install mpmath==1.3.0
          clang++ -std=c++23 -O2 diag/libm.cpp -o lm && ./lm > lm.txt && python diag/libm.py lm.txt
