name: diag (temporary)
on:
  push:
    branches: [win-wide]
jobs:
  fuzz:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { hdr: before, runner: windows-latest, arch: x64, cxxflags: "/arch:AVX2 /fp:contract" }
          - { hdr: after, runner: windows-latest, arch: x64, cxxflags: "/arch:AVX2 /fp:contract" }
          - { hdr: before, runner: windows-11-arm, arch: ARM64, cxxflags: "/fp:contract" }
          - { hdr: after, runner: windows-11-arm, arch: ARM64, cxxflags: "/fp:contract" }
    name: fuzz ${{ matrix.hdr }} (${{ matrix.arch }} ${{ matrix.cxxflags }})
    env:
      CXXFLAGS: ${{ matrix.cxxflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: matrix.hdr == 'before'
        run: git checkout df82f57 -- include
      - run: python -m pip install mpmath==1.3.0
      - run: |
          cmake -B build -A ${{ matrix.arch }} -DQUATERNION_BUILD_EXAMPLES=OFF
          cmake --build build --config Release -j --target quaternion_fuzz_eval
      - run: |
          python fuzz/fuzz.py --exe build/Release/quaternion_fuzz_eval.exe --types double --n 250 --seed 20261014 --report r.md || echo "fuzz exit $?"
          cat r.md
