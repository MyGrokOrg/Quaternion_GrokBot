name: Nightly mpmath fuzz

# Random special-function inputs checked against mpmath (fuzz/fuzz.py).  Runs nightly and on
# demand; it is a separate workflow, so it never blocks a push or pull request.  The seed is
# printed and written to the job summary; rerun with the same seed to reproduce.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (empty = random)"
        required: false
        default: ""
      samples:
        description: "Samples per function and type"
        required: false
        default: "250"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-14, cxx: g++-14, flags: "" }
          - { name: clang-18-libcxx, cxx: clang++-18, flags: "-stdlib=libc++" }
          # FMA builds: -march=haswell lets both compilers contract a*b+c into fma (gcc by
          # default, clang with its default -ffp-contract=on); see "FMA audit" in the README.
          - { name: gcc-14-haswell, cxx: g++-14, flags: "-march=haswell" }
          - { name: clang-19-haswell, cxx: clang++-19, flags: "-march=haswell", llvm: 19 }
    name: fuzz (${{ matrix.compiler.name }})
    steps:
      - uses: actions/checkout@v5
      - name: Check the CPU has FMA/AVX2
        if: contains(matrix.compiler.flags, 'haswell')
        run: grep -qw fma /proc/cpuinfo && grep -qw avx2 /proc/cpuinfo
      - name: Install clang from apt.llvm.org
        if: matrix.compiler.llvm
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.compiler.llvm }}
      - name: Install libc++ and mpmath
        run: |
          if [[ "${{ matrix.compiler.flags }}" == *libc++* ]]; then
            sudo apt-get update && sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          fi
          python3 -m pip install --user mpmath==1.3.0
      - name: Build evaluator
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS=${{ matrix.compiler.flags }}" -DQUATERNION_BUILD_EXAMPLES=OFF
          cmake --build build -j --target quaternion_fuzz_eval
      - name: Fuzz
        run: |
          seed="${{ github.event.inputs.seed }}"
          n="${{ github.event.inputs.samples }}"
          python3 fuzz/fuzz.py --exe build/quaternion_fuzz_eval --n "${n:-250}" ${seed:+--seed "$seed"} --report fuzz-report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report-${{ matrix.compiler.name }}
          path: fuzz-report.md

  # Windows: MSVC (latest toolset) and clang-cl, x64 on windows-latest and ARM64 on
  # windows-11-arm.  The /arch:AVX2 builds contract a*b+c into fma (MSVC only with
  # /fp:contract; clang-cl by default), as does clang-cl on ARM64.  double only: long double
  # is the same binary64 type there, and the fuzz bounds for long double are in x87 ulps.
  fuzz-windows:
    runs-on: ${{ matrix.runner || 'windows-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: msvc, toolset: "" }
          - { name: msvc-avx2-contract, toolset: "", cxxflags: "/arch:AVX2 /fp:contract" }
          - { name: clang-cl-avx2, toolset: "-T ClangCL", cxxflags: "/arch:AVX2" }
          - { name: msvc-arm64, toolset: "", arch: ARM64, runner: windows-11-arm }
          - { name: clang-cl-arm64, toolset: "-T ClangCL", arch: ARM64, runner: windows-11-arm }
    name: fuzz (${{ matrix.name }})
    env:
      CXXFLAGS: ${{ matrix.cxxflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install mpmath
        run: python -m pip install mpmath==1.3.0
      - name: Build evaluator
        run: |
          cmake -B build -A ${{ matrix.arch || 'x64' }} ${{ matrix.toolset }} -DQUATERNION_BUILD_EXAMPLES=OFF
          cmake --build build --config Release -j --target quaternion_fuzz_eval
      - name: Fuzz
        run: |
          seed="${{ github.event.inputs.seed }}"
          n="${{ github.event.inputs.samples }}"
          python fuzz/fuzz.py --exe build/Release/quaternion_fuzz_eval.exe --types double --n "${n:-250}" ${seed:+--seed "$seed"} --report fuzz-report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report-${{ matrix.name }}
          path: fuzz-report.md

  # macOS: Apple Clang (Xcode, the SDK's libc++).  arm64 on macos-latest, where Clang contracts
  # a*b+c into fma by default and long double is double (double only, as on Windows); x86_64
  # on macos-15-intel, no fma, x87 80-bit long double (double and long double).
  fuzz-macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: apple-clang-arm64, runner: macos-latest, types: "double" }
          - { name: apple-clang-x86_64, runner: macos-15-intel, types: "double,long double" }
    name: fuzz (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mpmath
        run: python -m pip install mpmath==1.3.0
      - name: Build evaluator
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=$(xcrun -f clang++) -DCMAKE_BUILD_TYPE=Release -DQUATERNION_BUILD_EXAMPLES=OFF
          cmake --build build -j 4 --target quaternion_fuzz_eval
      - name: Fuzz
        run: |
          seed="${{ github.event.inputs.seed }}"
          n="${{ github.event.inputs.samples }}"
          python fuzz/fuzz.py --exe build/quaternion_fuzz_eval --types "${{ matrix.types }}" --n "${n:-250}" ${seed:+--seed "$seed"} --report fuzz-report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report-${{ matrix.name }}
          path: fuzz-report.md

  # Informational: the same stress points through non-FMA and FMA builds of gcc and clang,
  # all compared with mpmath (fuzz/fma_audit.py); the table goes to the job summary.
  fma-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Check the CPU has FMA/AVX2
        run: grep -qw fma /proc/cpuinfo && grep -qw avx2 /proc/cpuinfo
      - name: Install clang 19 and mpmath
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          python3 -m pip install --user mpmath==1.3.0
      - name: Build evaluators
        run: |
          for c in g++-14 clang++-19; do
            $c -std=c++23 -O2 -Iinclude fuzz/fuzz_eval.cpp -o fe-$c &
            $c -std=c++23 -O2 -march=haswell -Iinclude fuzz/fuzz_eval.cpp -o fe-$c-hsw &
          done
          wait
      - name: Audit
        run: |
          seed="${{ github.event.inputs.seed }}"
          exes="--exe gcc=fe-g++-14 --exe gcc-hsw=fe-g++-14-hsw --exe clang=fe-clang++-19 --exe clang-hsw=fe-clang++-19-hsw"
          # targeted near-equal-subtraction sites, then every function on the fuzz regions
          python3 fuzz/fma_audit.py --sites $exes --n 150 --seed "${seed:-$GITHUB_RUN_ID}" --report fma-sites.md
          python3 fuzz/fma_audit.py $exes --n 150 --seed "${seed:-$GITHUB_RUN_ID}" --report fma-functions.md
          cat fma-sites.md fma-functions.md > fma-audit.md
          cat fma-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fma-audit
          path: fma-audit.md
